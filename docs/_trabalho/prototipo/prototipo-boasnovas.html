<title>Protótipo Boas Novas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Instrument+Serif:ital@1&family=Inter+Tight:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* layout: painel de etapas à esquerda + aparelho (celular ou computador) no palco; no celular o app ocupa a tela e as etapas viram uma folha.
   tokens: os da referência visual oficial da Boas Novas (docs/marca/referencia-visual-boas-novas.html). */
:root{
  --bg:#F4F4EF; --surface:#FFFFFF; --cream:#EAE7DC; --mint:#D6E7D8; --mint-soft:#E7F0E8;
  --ink:#161B16; --ink-2:#4A5249; --ink-3:#5F675D; --line:#D3D8CE; --line-strong:#868D82;
  --green:#2B503F; --green-deep:#1E3A2D; --on-green:#FFFFFF; --sage:#778867; --sage-ink:#576947;
  --ring-a:#CFE4BC; --ring-b:#11200D; --selo:#2B503F; --on-selo:#FFFFFF;
  --ok-fg:#1F6B43; --ok-bg:#DCEFE2; --wait-fg:#6B4D14; --wait-bg:#F1E6CE;
  --no-fg:#A82B1D; --no-bg:#F8DEDA; --swap-fg:#164B67; --swap-bg:#DCE8EE;
  --night:#0E1210; --night-2:#18201B; --night-ink:#F4F4EF; --night-sub:#B8C2BA; --night-label:#9DB08C; --night-line:#2A342D;
  --stage:#E4E7DE; --frame:#111511; --knob:#FFFFFF; --veu:rgba(12,16,13,.42);
  --qr-bg:#FFFFFF; --qr-fg:#141814; --etq-alerta:#141814; --etq-sub:#5A605A; --on-j:#FFFFFF;
  --map-bg:#EDF0E8; --map-block:#E0E5D9; --map-road:#FFFFFF; --map-water:#D3E2E7; --map-park:#D2E5D3; --map-tree:#B9D3BC; --map-label:#7B8577;
  --shadow:0 1px 2px rgba(22,27,22,.06),0 8px 24px rgba(22,27,22,.07);
  --shadow-lg:0 2px 8px rgba(22,27,22,.10),0 24px 56px rgba(22,27,22,.18);
  --f-display:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-wide:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-serif:"Instrument Serif",Georgia,serif;
  --r-sm:8px; --r-md:16px; --r-lg:24px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#16201A; --cream:#1B261F; --mint:#1E3327; --mint-soft:#18291F;
    --ink:#E2EDE5; --ink-2:#A9B8AD; --ink-3:#84938A; --line:#2A3A30; --line-strong:#4A5E50;
    --green:#8FC2A0; --green-deep:#A9D4B6; --on-green:#0F1612; --sage:#9DB08C; --sage-ink:#AFC0A2;
    --ring-a:#8FA97E; --ring-b:#07100A;
    --ok-fg:#9FD9B3; --ok-bg:#16271D; --wait-fg:#F0C46B; --wait-bg:#2A2210;
    --no-fg:#F49A8C; --no-bg:#2E1714; --swap-fg:#8CC4E3; --swap-bg:#12232D;
    --night:#0A0F0C; --night-2:#141B16;
    --stage:#070B09; --frame:#000000; --veu:rgba(0,0,0,.55);
    --map-bg:#121A15; --map-block:#18231C; --map-road:#243229; --map-water:#13262D; --map-park:#173021; --map-tree:#1F3B2A; --map-label:#6E7D72;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#16201A; --cream:#1B261F; --mint:#1E3327; --mint-soft:#18291F;
  --ink:#E2EDE5; --ink-2:#A9B8AD; --ink-3:#84938A; --line:#2A3A30; --line-strong:#4A5E50;
  --green:#8FC2A0; --green-deep:#A9D4B6; --on-green:#0F1612; --sage:#9DB08C; --sage-ink:#AFC0A2;
  --ring-a:#8FA97E; --ring-b:#07100A;
  --ok-fg:#9FD9B3; --ok-bg:#16271D; --wait-fg:#F0C46B; --wait-bg:#2A2210;
  --no-fg:#F49A8C; --no-bg:#2E1714; --swap-fg:#8CC4E3; --swap-bg:#12232D;
  --night:#0A0F0C; --night-2:#141B16;
  --stage:#070B09; --frame:#000000; --veu:rgba(0,0,0,.55);
  --map-bg:#121A15; --map-block:#18231C; --map-road:#243229; --map-water:#13262D; --map-park:#173021; --map-tree:#1F3B2A; --map-label:#6E7D72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 24px 56px rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;flex:none}
.tnum{font-variant-numeric:tabular-nums}
.visualmente-oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- moldura do protótipo ---------- */
.proto{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);height:100%}
.tour{background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding-block:26px 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;gap:22px;scrollbar-width:thin}
.tour-topo{display:flex;align-items:center;gap:10px;color:var(--green)}
.tour-topo .wm{width:118px;color:var(--ink)}
.tour-fechar{display:none;margin-left:auto}
.tour h1{font-family:var(--f-display);font-weight:300;font-size:40px;line-height:.92;letter-spacing:-.045em;color:var(--sage);text-wrap:balance}
.tour .lede{color:var(--ink-2);font-size:14.5px;margin-top:10px;max-width:42ch}
.selo-dados{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:600;color:var(--wait-fg);background:var(--wait-bg);padding:4px 10px;border-radius:999px}
.principios{display:flex;flex-wrap:wrap;gap:6px}
.principios span{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.tour-sec{display:flex;flex-direction:column;gap:10px}
.tour-sec>.ov{display:block}
.personas{display:flex;flex-wrap:wrap;gap:6px}
.personas button{font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2)}
.personas button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.etapas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:et}
.etapas button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;padding:8px 10px;border-radius:12px;font-size:14px;color:var(--ink-2)}
.etapas button:hover{background:var(--mint-soft)}
.etapas .n{font-family:var(--f-wide);font-stretch:112.5%;font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--ink-3)}
.etapas button[aria-current="step"]{background:var(--mint);color:var(--ink);font-weight:600}
.etapas button[aria-current="step"] .n{color:var(--green)}
.etapas small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.como{background:var(--cream);border-radius:var(--r-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.como h3{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:-.015em;color:var(--sage-ink)}
.como ul{margin:0;padding-left:1.1em;display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.como ul li::marker{color:var(--sage)}
.como .muda{font-size:13px;color:var(--ink-2);border-top:1.5px solid var(--sage);padding-top:10px}
.nav-etapa{display:flex;gap:8px}
.nav-etapa .btn{flex:1}
.temas{display:flex;gap:6px}
.temas button{flex:1;font-size:13px;padding:8px;border-radius:10px;border:1px solid var(--line);color:var(--ink-2)}
.temas button[aria-pressed="true"]{border-color:var(--green);color:var(--green);font-weight:600;background:var(--mint-soft)}
.ref{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.tour-pe{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:14px}

.palco{position:relative;overflow:hidden;display:grid;place-items:center}
.aparelho{position:relative;transform-origin:center center;flex:none}
/* no computador o aparelho fica preso ao centro do palco: a grade crescia junto com a moldura de 1240px e empurrava o painel para a direita */
@media (min-width:1024px){.aparelho{position:absolute;left:50%;top:50%}}
.aparelho.celular{width:390px;height:844px;border-radius:58px;padding:12px;background:var(--frame);box-shadow:0 0 0 1.5px rgba(255,255,255,.07) inset,0 40px 90px rgba(0,0,0,.30)}
.aparelho.celular::before{content:"";position:absolute;top:24px;left:50%;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:var(--frame);z-index:400}
.aparelho.celular .app{border-radius:46px}
.aparelho.celular .app::after{content:"";position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.8;z-index:300;pointer-events:none}
.aparelho.computador{width:1240px;height:780px;border-radius:16px;background:var(--frame);padding:0 10px 10px;box-shadow:0 40px 90px rgba(0,0,0,.30)}
.chrome{height:40px;display:flex;align-items:center;gap:8px;padding:0 6px}
.chrome i{width:11px;height:11px;border-radius:50%;background:#3A403B;display:block}
.chrome span{margin-left:16px;font-size:12px;color:#A7B0A9;background:#1E231F;border-radius:8px;padding:5px 14px;min-width:280px}
.aparelho.computador .app{height:calc(100% - 40px);border-radius:8px}
.aparelho.celular .chrome{display:none}

/* ---------- app ---------- */
.app{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.status{height:52px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 32px 8px;font:600 15px var(--f-body);color:var(--ink)}
.status .st{display:flex;gap:6px;align-items:center}
.status svg{width:18px;height:12px}
.aparelho.computador .status{display:none}
.vista{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.vista::-webkit-scrollbar{display:none}
.vista.cheia{overflow:hidden}
.pg{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:32px;display:flex;flex-direction:column;gap:18px}
.vista.entra>*{animation:entra .28s cubic-bezier(.2,.8,.2,1) both}
.vista.volta>*{animation:volta .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateX(22px)}}
@keyframes volta{from{opacity:0;transform:translateX(-22px)}}

.abas{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:50}
.aparelho.celular .abas{padding-bottom:26px}
.aba{display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-3);padding:4px 0;letter-spacing:-.01em}
.aba .ic{width:24px;height:24px}
.aba[aria-current="page"]{color:var(--green);font-weight:600}

/* tipografia */
.ov{font-family:var(--f-wide);font-stretch:112.5%;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.tt{font-family:var(--f-display);font-weight:300;font-size:36px;line-height:.96;letter-spacing:-.045em;color:var(--sage);text-wrap:balance}
.h2{font-family:var(--f-display);font-weight:500;font-size:20px;line-height:1.15;letter-spacing:-.015em;color:var(--ink)}
.h3{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25;color:var(--ink)}
.peq{font-size:13.5px;color:var(--ink-2)}
.leg{font-size:12px;color:var(--ink-3);font-weight:500}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-t button{font-size:13px;font-weight:600;color:var(--green)}

/* topo de tela */
.topo{display:flex;align-items:flex-end;gap:12px;padding-top:10px}
.topo-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.barra{display:flex;align-items:center;gap:8px;padding-top:4px}
.barra b{font-family:var(--f-display);font-weight:600;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;position:relative;transition:background .15s}
.ic-btn:hover{background:var(--mint-soft)}
.ic-btn.borda{border:1px solid var(--line);background:var(--surface)}
.ponto{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;font:600 15px/1.1 var(--f-body);border:1.5px solid var(--green);transition:transform .12s ease,background .2s ease,color .2s ease;white-space:nowrap;text-align:center}
.btn:active{transform:scale(.97)}
.btn .ic{width:19px;height:19px}
.btn.primario{background:var(--green);color:var(--on-green)}
.btn.primario:hover{background:var(--green-deep);border-color:var(--green-deep)}
.btn.secundario{background:transparent;color:var(--green)}
.btn.fantasma{border-color:transparent;color:var(--ink-2);background:transparent}
.btn.claro{background:var(--night-ink);border-color:var(--night-ink);color:var(--night)}
.btn.largo{width:100%}
.btn.peq{min-height:38px;padding:0 15px;font-size:13.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.acoes-col{display:flex;flex-direction:column;gap:8px}
.rodape-acao{position:sticky;bottom:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px)) 16px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;flex-direction:column;gap:8px;margin-top:auto}

/* chips de status (cor + ícone + rótulo) */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;line-height:1.2}
.chip .ic{width:13px;height:13px;stroke-width:2.1}
.chip.ok{color:var(--ok-fg);background:var(--ok-bg)}
.chip.wait{color:var(--wait-fg);background:var(--wait-bg)}
.chip.no{color:var(--no-fg);background:var(--no-bg)}
.chip.swap{color:var(--swap-fg);background:var(--swap-bg)}
.chip.neutro{color:var(--green);background:var(--mint)}
.chip.noite{color:var(--night-ink);background:var(--night-line)}

/* superfícies */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.toque{transition:transform .12s ease;text-align:left;width:100%}
.card.toque:active{transform:scale(.985)}
.ecard{background:var(--cream);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.ecard .linha-t{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hora{font-family:var(--f-display);font-weight:400;font-size:40px;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.lugar{font-family:var(--f-display);font-weight:500;color:var(--sage-ink);font-size:16px}
.quando{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ficha{font-size:14px;color:var(--ink-2)}
.ecard .pe{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.noite{background:var(--night);color:var(--night-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.noite .ov{color:var(--night-label)}
.noite p{color:var(--night-sub);font-size:14px}
.noite .grande{font-family:var(--f-display);font-weight:400;font-size:52px;letter-spacing:-.05em;line-height:.95;font-variant-numeric:tabular-nums}
.noite .marca-dagua{position:absolute;right:-30px;bottom:-30px;color:var(--night-label);opacity:.10;pointer-events:none}

.lista{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li.sem-dt{grid-template-columns:minmax(0,1fr) auto}
.li.com-av{grid-template-columns:36px minmax(0,1fr) auto}
.dt{text-align:center;line-height:1}
.dt b{display:block;font-family:var(--f-display);font-weight:400;font-size:23px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dt span{font-family:var(--f-wide);font-stretch:112.5%;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.x{min-width:0}
.x b{display:block;font-weight:600;font-family:var(--f-display);font-size:15px;line-height:1.25}
.x span{display:block;font-size:13px;color:var(--ink-3);line-height:1.35}
.li .seta{color:var(--ink-3)}

.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--green);font:700 12px/1 var(--f-body);flex:none;letter-spacing:.02em}
.av.g{width:52px;height:52px;font-size:16px}
.av.gg{width:72px;height:72px;font-size:22px}
.avs{display:flex;align-items:center}
.avs .av{width:28px;height:28px;font-size:10px;border:2px solid var(--surface);margin-left:-8px}
.avs .av:first-child{margin-left:0}
.ecard .avs .av{border-color:var(--cream)}

.destaques{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px))}
.destaques::-webkit-scrollbar{display:none}
.dq{display:grid;justify-items:center;gap:7px;flex:none;width:66px;font-size:11.5px;font-weight:500;color:var(--ink-2);text-align:center;line-height:1.2}
.dq i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:var(--selo);color:var(--on-selo);box-shadow:0 0 0 2.5px var(--bg),0 0 0 4px var(--sage);transition:transform .15s}
.dq:active i{transform:scale(.94)}
.dq .ic{width:24px;height:24px}

.pils{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.pils::-webkit-scrollbar{display:none}
.pil{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.pil[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}

.rot{font-size:13px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:6px}
.campo{width:100%;min-height:52px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);color:var(--ink);font-size:16px;padding:12px 14px}
textarea.campo{min-height:112px;resize:none;line-height:1.45}
.campo:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.ajuda{font-size:13px;color:var(--ink-3);margin-top:6px}
.grupo{display:flex;flex-direction:column}
.codigo{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.codigo span{height:58px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:400;font-variant-numeric:tabular-nums}
.codigo span.f{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.progresso{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progresso span{display:block;height:100%;background:var(--green);border-radius:2px;transition:width .4s ease}
.opcao{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opcao[aria-checked="true"]{border-color:var(--green);background:var(--mint-soft)}
.opcao .marca{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center}
.opcao[aria-checked="true"] .marca{border-color:var(--green);background:var(--green);color:var(--on-green)}
.opcao .marca .ic{width:14px;height:14px;stroke-width:2.4}
.chave{position:relative;width:48px;height:28px;border-radius:999px;background:var(--line-strong);transition:background .2s;flex:none}
.chave::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.chave[aria-checked="true"]{background:var(--green)}
.chave[aria-checked="true"]::after{transform:translateX(20px)}
.linha-chave{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14.5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--mint-soft);padding:4px;border-radius:12px}
.seg button{padding:9px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--green);box-shadow:var(--shadow)}

/* splash */
.splash{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:0 max(18px,env(safe-area-inset-left,0px)) 28px;overflow:hidden}
.aneis{position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 38%,var(--ring-a) 0 2.2px,var(--ring-b) 2.2px 6.5px)}
.splash-card{position:relative;background:var(--cream);border-radius:22px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:14px;margin-bottom:auto;margin-top:18%}
.splash-card .wm{width:150px;color:var(--sage-ink)}
.splash-tt{font-family:var(--f-display);font-weight:300;font-size:46px;line-height:.92;letter-spacing:-.05em;color:var(--sage)}
.splash-tt em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--green)}
.splash-card p{color:var(--ink-2);font-size:15px}
.splash-acoes{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:18px}
.splash-acoes .btn.secundario{background:var(--cream);border-color:var(--cream);color:var(--green)}
.micro{font-family:var(--f-wide);font-stretch:112.5%;font-weight:600;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ring-a);text-align:center;margin-top:4px}

/* home */
.home-topo{display:flex;align-items:center;justify-content:space-between;color:var(--green);padding-top:4px}
.saud{display:flex;align-items:center;gap:14px}
.saud .tt{font-size:34px}
.semana{background:var(--cream);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.semana .linha{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr) auto;gap:6px;align-items:center}
.semana .linha span{background:var(--sage);color:var(--bg);border-radius:9px;padding:8px 10px;font-family:var(--f-wide);font-stretch:112.5%;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.semana .linha span:nth-child(2){background:var(--green);color:var(--on-green);text-align:center}
.semana .linha span:nth-child(3){background:var(--mint);color:var(--green);text-align:center;min-width:52px}
.semana .linha.dom span:first-child{grid-column:1}
.semana .linha.dom{grid-template-columns:minmax(0,1fr) auto}
.semana .linha.dom span:nth-child(2){grid-column:2;padding-left:14px;padding-right:14px}
.evento-dq{position:relative;border-radius:20px;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;width:100%;background:var(--night);color:var(--night-ink)}
.evento-dq::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 85% 30%,rgba(207,228,188,.30) 0 1.2px,transparent 1.2px 6px)}
.evento-dq>*{position:relative}
.evento-dq .t{font-family:var(--f-wide);font-stretch:125%;font-weight:500;font-size:30px;letter-spacing:.12em;line-height:1;text-transform:uppercase}
.evento-dq .s{font-family:var(--f-wide);font-stretch:112.5%;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--night-label);margin-bottom:8px}
.jornada-mini{display:flex;flex-direction:column;gap:10px}
.jornada-mini .barra-j{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
/* jornada bn: 12 passos com as cores medidas na arte da igreja (escurecidas onde o texto branco pedia) */
.jp{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;position:relative;padding:5px 0}
.jp::before,.anot::before{content:"";position:absolute;left:25px;top:0;bottom:0;width:2px;background:var(--line)}
.jp:first-child::before{top:50%}
.jp.ult::before{bottom:50%}
.jp.f::before{background:var(--jv)}
.jp .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:500;font-size:18px;font-variant-numeric:tabular-nums;position:relative;z-index:1;background:var(--surface);color:var(--ink);border:2px solid var(--jv)}
.jp .num .ic{width:22px;height:22px;stroke-width:2.2}
.jp.f .num,.jp.a .num{background:var(--jc);color:var(--on-j);border-color:var(--jc)}
.jp.a .num{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--jv)}
.jp .bloco-j{border-radius:16px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.jp.f .bloco-j,.jp.a .bloco-j{background:var(--jc);border-color:var(--jc);color:var(--on-j)}
.jp .bloco-j b{font-family:var(--f-wide);font-stretch:112.5%;font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.jp .bloco-j span{font-size:13px}
.jp:not(.f):not(.a) .bloco-j span{color:var(--ink-3)}
.jp .tag-j{align-self:flex-start;margin-top:6px;font-size:11px;font-weight:700;background:var(--on-j);color:var(--jc);padding:2px 9px;border-radius:999px}
.anot{position:relative;font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--green);padding:6px 0 6px 64px;display:flex;align-items:center;gap:6px;line-height:1.1}
.anot .ic{width:17px;height:17px}
.cond{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.cond .x{display:flex;flex-direction:column;gap:4px}
/* no escuro, o aro dos passos ainda não feitos clareia um pouco para não sumir no fundo */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .jp:not(.f):not(.a) .num{border-color:color-mix(in srgb,var(--jv) 70%,#fff)}}
:root[data-theme="dark"] .jp:not(.f):not(.a) .num{border-color:color-mix(in srgb,var(--jv) 70%,#fff)}
.trilha-j{display:flex;flex-direction:column;margin-top:4px}
.jornada-mini .barra-j i{height:6px;border-radius:3px;background:var(--line)}
.jornada-mini .barra-j i.f{background:var(--green)}
.jornada-mini .barra-j i.m{background:linear-gradient(90deg,var(--green) 80%,var(--line) 80%)}
.funcao-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--mint);border-radius:16px;padding:14px}
.funcao-card i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--selo);color:var(--on-selo)}

/* jornada */
.anel{--p:81;width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.anel span{width:62px;height:62px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}

/* mapa */
.mapa{position:absolute;inset:0}
.mapa-svg{width:100%;height:100%;display:block}
.m-bg{fill:var(--map-bg)} .m-q{fill:var(--map-block)} .m-agua{fill:var(--map-water)} .m-parque{fill:var(--map-park)} .m-arv{fill:var(--map-tree)}
.m-rua{stroke:var(--map-road);fill:none;stroke-linecap:round} .m-rot{fill:var(--map-label);font-family:var(--f-wide);font-stretch:112.5%;font-size:9px;font-weight:600;letter-spacing:.16em}
.m-area{fill:var(--green);fill-opacity:.13;stroke:var(--green);stroke-opacity:.45;stroke-width:1.5}
.m-pino{fill:var(--selo);stroke:var(--surface);stroke-width:3}
.m-sel .m-area{fill-opacity:.22;stroke-width:2}
.m-eu{fill:var(--green-deep);stroke:var(--surface);stroke-width:3}
.m-eu-halo{fill:var(--green);fill-opacity:.16}
.m-tag rect{fill:var(--surface)} .m-tag text{fill:var(--ink);font:600 11px var(--f-body)}
.mapa-topo{position:absolute;left:0;right:0;top:0;padding:10px max(14px,env(safe-area-inset-left,0px)) 0;display:flex;flex-direction:column;gap:10px;z-index:5}
.busca{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;height:48px;box-shadow:var(--shadow);color:var(--ink-3);font-size:14.5px}
.mapa-topo .linha{display:flex;gap:10px}
.mapa-topo .ic-btn{background:var(--surface);box-shadow:var(--shadow);width:48px;height:48px}
.mapa-topo .pils{margin:0;padding:0}
.mapa-topo .pil{box-shadow:var(--shadow);border-color:transparent}
.folha-mapa{position:absolute;left:0;right:0;bottom:0;max-height:47%;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);z-index:6;display:flex;flex-direction:column}
.folha-mapa .alca{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.folha-mapa .rolar{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.hc-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.hc-item:last-child{border-bottom:0}
.hc-item b{font-family:var(--f-display);font-weight:600;font-size:16px}
.hc-item .km{font-family:var(--f-display);font-size:15px;color:var(--green);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.hc-capa{position:relative;border-radius:22px;overflow:hidden;padding:16px;background:repeating-radial-gradient(circle at 80% 120%,var(--ring-a) 0 1.6px,var(--ring-b) 1.6px 5px)}
.hc-capa .in{background:var(--cream);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.hc-capa .tt{font-size:40px}
.info{display:flex;flex-direction:column}
.info .linha-i{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.info .linha-i:last-child{border-bottom:0}
.info .linha-i .ic{color:var(--sage-ink);margin-top:1px}
.info b{display:block;font-weight:600;font-size:14.5px}
.info span{font-size:13.5px;color:var(--ink-3)}
.bloqueado{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.bloqueado .ic{width:15px;height:15px}

/* encontro (símbolo) */
.encontro{display:grid;place-items:center;padding:6px 0}
.encontro .sa{animation:chegaA 1s cubic-bezier(.2,.9,.2,1) both}
.encontro .sb{animation:chegaB 1s cubic-bezier(.2,.9,.2,1) both}
.encontro .sc{animation:aparece .6s .55s ease both}
@keyframes chegaA{from{transform:translate(70px,-70px);opacity:0}}
@keyframes chegaB{from{transform:translate(-70px,70px);opacity:0}}
@keyframes aparece{from{opacity:0}}

/* escala */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;min-width:0;transition:transform .12s}
.bloco:active{transform:scale(.98)}
.bloco .t1{font-family:var(--f-display);font-weight:600;font-size:14.5px}
.bloco .t2{font-size:12px;color:var(--ink-3)}
.bloco .cob{font-size:12.5px;font-weight:600}
.bloco .nomes{display:flex;flex-direction:column;gap:4px}
.bloco .nome{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bloco .nome i{width:7px;height:7px;border-radius:50%;flex:none}
.bloco .vaga{border:1.5px dashed var(--line-strong);border-radius:10px;padding:5px 6px;font-size:12px;color:var(--ink-3);text-align:center}
.st-ok{background:var(--ok-fg)} .st-wait{background:var(--wait-fg)} .st-swap{background:var(--swap-fg)} .st-no{background:var(--no-fg)}
.resumo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.resumo div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.resumo b{display:block;font-family:var(--f-display);font-weight:300;font-size:30px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.resumo span{font-size:12px;color:var(--ink-3);line-height:1.3;display:block;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-c{font-family:var(--f-wide);font-stretch:112.5%;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cal-d{aspect-ratio:1;min-height:40px;border-radius:12px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.cal-d.off{border-color:transparent;background:none;color:var(--line-strong);font-weight:400}
.cal-d.sim{background:var(--ok-bg);border-color:var(--ok-fg);color:var(--ok-fg)}
.cal-d.nao{background:var(--no-bg);border-color:var(--no-fg);color:var(--no-fg);text-decoration:line-through}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.cal-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1.5px solid var(--line);background:var(--surface)}
.cal-leg i.sim{background:var(--ok-bg);border-color:var(--ok-fg)}
.cal-leg i.nao{background:var(--no-bg);border-color:var(--no-fg)}
.whats{background:var(--mint-soft);border-radius:16px;padding:14px}
.balao{background:var(--surface);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;line-height:1.4;box-shadow:var(--shadow)}
.pessoa-tg{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.pessoa-tg:last-child{border-bottom:0}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--on-green)}
.check .ic{width:15px;height:15px;stroke-width:2.6}
[aria-pressed="true"]>.check,[aria-checked="true"]>.check{background:var(--green);border-color:var(--green)}

/* kids */
.crianca{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.alerta{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--wait-fg);background:var(--wait-bg);border-radius:999px;padding:4px 10px}
.alerta .ic{width:14px;height:14px}
.qr-box{background:var(--qr-bg);border-radius:18px;padding:16px;display:grid;place-items:center;width:200px;margin:0 auto}
.qr-box svg{width:168px;height:168px;display:block}
.codigo-ret{font-family:var(--f-display);font-weight:300;font-size:56px;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.salas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sala{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.sala b{font-size:13px;font-weight:600}
.sala .barrinha{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.sala .barrinha i{display:block;height:100%;background:var(--green)}
.sala span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.registro{display:flex;gap:10px;align-items:flex-start;background:var(--ok-bg);color:var(--ok-fg);border-radius:14px;padding:12px 14px;font-size:13.5px}
.registro .ic{width:18px;height:18px;margin-top:1px}

/* palavras */
.capa{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#2b2f2c,#0d100e);color:#F4EFE3;aspect-ratio:16/10;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;text-align:left;width:100%;max-width:100%}
.capa::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 35%,rgba(255,255,255,.14),transparent 55%)}
.capa>*{position:relative;z-index:1}
.capa .serif{font-family:var(--f-serif);font-style:italic;font-size:40px;line-height:.9}
.capa .pesada{font-family:var(--f-wide);font-stretch:62%;font-weight:800;font-size:64px;line-height:.85;letter-spacing:-.01em;text-transform:uppercase}
.capa .play{position:absolute;right:18px;top:18px;width:52px;height:52px;border-radius:50%;background:rgba(244,239,227,.92);color:#121512;display:grid;place-items:center;z-index:2}
.capa .play .ic{width:22px;height:22px;margin-left:3px;fill:currentColor}
.capa .mini{font-family:var(--f-wide);font-stretch:112.5%;font-size:9px;letter-spacing:.16em;text-transform:uppercase;opacity:.8;margin-top:10px}
.trilho{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.trilho::-webkit-scrollbar{display:none}
.trilho .capa{flex:none;width:230px;aspect-ratio:16/10;padding:14px}
.trilho .capa .pesada{font-size:34px}
.trilho .capa.verde{background:linear-gradient(160deg,#1E3A2D,#0E1A13)}
.trilho .capa.areia{background:linear-gradient(160deg,#57513F,#24221A)}
.trilho .tit{font-family:var(--f-display);font-weight:600;font-size:14px;margin-top:8px;color:var(--ink)}
.player{background:#0b0d0c;border-radius:16px;aspect-ratio:16/9;display:grid;place-items:center;position:relative;overflow:hidden;color:#F4EFE3;max-width:100%}
.player .play{width:64px;height:64px;border-radius:50%;background:rgba(244,239,227,.95);color:#111;display:grid;place-items:center}
.player .play .ic{width:26px;height:26px;margin-left:3px;fill:currentColor}
.player .prog{position:absolute;left:14px;right:14px;bottom:14px;height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
.player .prog i{display:block;width:34%;height:100%;border-radius:2px;background:var(--ring-a)}

/* oração */
.orou{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--green)}
.orou .ic{width:16px;height:16px}

/* mais */
.perfil-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.menu-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu-it{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:18px;text-align:left;min-height:96px;justify-content:space-between}
.menu-it .ic{width:26px;height:26px;color:var(--green)}
.menu-it span{font-family:var(--f-display);font-weight:600;font-size:15px}

/* folha e aviso */
.camada{position:absolute;inset:0;z-index:200;display:flex;align-items:flex-end;background:var(--veu);animation:fade .2s ease both}
.folha{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) 26px;box-shadow:var(--shadow-lg);animation:sobe .3s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.folha .alca{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px;flex:none}
.aparelho.computador .camada{align-items:center;justify-content:center}
.aparelho.computador .folha{max-width:520px;border-radius:20px}
@keyframes sobe{from{transform:translateY(44px);opacity:.3}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:16px;right:16px;bottom:92px;z-index:250;background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 16px;font-size:14px;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow-lg);animation:sobe .25s ease both}
.toast .ic{width:19px;height:19px;color:var(--mint);flex:none}
.aparelho.computador .toast{left:auto;right:24px;bottom:24px;max-width:420px}

/* sem acesso */
.sem-acesso{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:56px 12px 24px}
.sem-acesso i{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:var(--mint-soft);color:var(--sage)}

/* computador (moderação) */
.desk{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;background:var(--bg)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.side .marca-side{display:flex;align-items:center;gap:10px;color:var(--green);padding:4px 10px 18px}
.side .marca-side .wm{width:104px;color:var(--ink)}
.side .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:var(--ink-2);text-align:left;width:100%;white-space:nowrap}
.side .it .ic{width:19px;height:19px}
.side .it:hover{background:var(--mint-soft)}
.side .it[aria-current="page"]{background:var(--mint);color:var(--green);font-weight:600}
.side .sep{height:1px;background:var(--line);margin:10px 4px}
.side .quem{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;font-size:13px;color:var(--ink-2)}
.dm{overflow-y:auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:22px;min-width:0}
.dm-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.dm-topo .tt{font-size:44px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi b{font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink-3);line-height:1.35}
.colunas{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.caixa{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.caixa .cab{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.pend{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.pend:last-child{border-bottom:0}
.pend i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--mint-soft);color:var(--green)}
.pend i.at{background:var(--wait-bg);color:var(--wait-fg)}
.pend b{display:block;font-weight:600;font-size:14.5px}
.pend span{font-size:13px;color:var(--ink-3)}
.tabela-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:620px}
th{font-family:var(--f-wide);font-stretch:112.5%;font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--mint-soft);text-align:left;padding:10px 14px;white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--mint-soft)}
tr.clic{cursor:pointer}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--mint);color:var(--green);margin:1px 4px 1px 0;white-space:nowrap}
.painel-p{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.func-tg{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.func-tg:last-of-type{border-bottom:0}
.func-tg i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--mint-soft);color:var(--green)}
.func-tg b{display:block;font-size:14px;font-weight:600}
.func-tg span{font-size:12.5px;color:var(--ink-3)}
.trava{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.trava .ic{width:15px;height:15px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--mint-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-family:var(--f-display);font-weight:600;font-size:14px;display:flex;justify-content:space-between}
.col h3 span{color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.kc b{font-size:14px;font-weight:600}
.kc span{font-size:12.5px;color:var(--ink-3)}
.mapa-desk{position:relative;height:380px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.fases{display:flex;flex-direction:column;gap:12px}
.fase{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.fase .num{font-family:var(--f-wide);font-stretch:112.5%;font-weight:800;font-size:34px;line-height:1;color:var(--green);letter-spacing:-.04em}
.fase b{font-family:var(--f-display);font-weight:600;font-size:17px;display:block}
.fase p{font-size:14px;color:var(--ink-2);margin-top:4px}
.fase .decide{font-size:13px;color:var(--wait-fg);margin-top:8px}

/* etiquetas do kids (papel impresso: sempre claro) */
.etiquetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.etq{background:var(--qr-bg);color:var(--qr-fg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-width:0}
.etq.resp{grid-column:1 / -1;border:1.5px dashed var(--qr-fg)}
.etq-t b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1.1}
.etq-t span{font-family:var(--f-wide);font-stretch:112.5%;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.etq-c{display:flex;flex-direction:column;gap:4px}
.etq-c>span{font-family:var(--f-display);font-size:24px;letter-spacing:.14em;font-variant-numeric:tabular-nums;line-height:1}
.etq-c em{font-style:normal;display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;background:var(--etq-alerta);color:var(--qr-bg);border-radius:4px;padding:2px 6px;align-self:flex-start}
.etq-c em .ic{width:12px;height:12px}
.etq-c small{font-size:10px;color:var(--etq-sub)}

/* mapa dos processos */
.legenda{display:flex;flex-wrap:wrap;gap:8px 16px}
.legenda span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.legenda i{width:14px;height:14px;border-radius:4px;display:block}
.fluxo{display:flex;flex-direction:column;gap:10px}
.raia{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.raia h3{font-family:var(--f-display);font-weight:600;font-size:15px}
.passos-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.pf{display:flex;flex-direction:column;gap:2px;padding:8px 11px;border-radius:12px;background:var(--mint-soft);min-width:0;max-width:190px}
.pf b{font-size:13px;font-weight:600;line-height:1.25;color:var(--ink)}
.pf span{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.pf.dc{background:var(--wait-bg)} .pf.dc b{color:var(--wait-fg)}
.pf.dn{background:var(--selo)} .pf.dn b,.pf.dn span{color:var(--on-selo)}
.pf.pr{background:var(--mint)} .pf.pr b{color:var(--green)}
.pf.ms{background:var(--swap-bg)} .pf.ms b{color:var(--swap-fg)}
.seta-f{color:var(--ink-3);display:flex}
.seta-f .ic{width:16px;height:16px}
@media (max-width:1023px){.raia{grid-template-columns:1fr;gap:8px}}

/* ---------- celular (sem moldura) ---------- */
.mob-bar{display:none}
@media (max-width:1023px){
  body{background:var(--bg)}
  .proto{display:flex;flex-direction:column}
  .mob-bar{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));flex:none;z-index:500}
  .mob-et{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:4px 0}
  .mob-et b{font-family:var(--f-display);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mob-et .ov{font-size:9.5px}
  .tour{position:fixed;inset:0;z-index:600;border-right:0;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  .tour.aberto{transform:none}
  .tour-fechar{display:grid}
  .palco{flex:1;display:block}
  .aparelho,.aparelho.celular,.aparelho.computador,.aparelho.tablet{width:100%;height:100%;border-radius:0;padding:0;background:none;box-shadow:none;transform:none!important}
  .disp{display:none!important}
  .aparelho.celular::before,.aparelho.celular .app::after{display:none}
  .aparelho.celular .app,.aparelho.computador .app,.aparelho.tablet .app{border-radius:0;height:100%}
  .chrome{display:none}
  .aparelho.celular .abas{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .desk{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left,0px));gap:4px;scrollbar-width:none}
  .side .marca-side,.side .sep,.side .quem{display:none}
  .side .it{flex:none}
  .dm{padding:18px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .dm-topo .tt{font-size:36px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .colunas{grid-template-columns:1fr}
  .painel-p{position:static}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- site da igreja (etapa "o site") ----------
   O site se ajusta à largura do lugar onde está (container queries), e não à tela inteira:
   o mesmo código vira site de celular dentro da moldura do celular, de tablet no tablet e de
   computador no computador, e também se ajusta sozinho quando aberto num celular de verdade. */
.app{container:app / inline-size}
.aparelho.tablet{width:820px;height:1180px;border-radius:46px;padding:14px;background:var(--frame);box-shadow:0 0 0 1.5px rgba(255,255,255,.07) inset,0 40px 90px rgba(0,0,0,.30)}
.aparelho.tablet .app{border-radius:34px}
.disp{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.disp[hidden]{display:none}
.disp button{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.disp button .ic{width:17px;height:17px}
.disp button:hover{background:var(--mint-soft)}
.disp button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.s-url{position:absolute;left:14px;right:14px;bottom:14px;z-index:40;height:42px;border-radius:14px;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow);pointer-events:none}
.s-url .ic{width:13px;height:13px}
.vista.site-v{container:site / inline-size;scroll-behavior:smooth;background:var(--bg)}
@media (prefers-reduced-motion: reduce){.vista.site-v{scroll-behavior:auto}}
.vista.site-v.com-url .site{padding-bottom:64px}

.site{--s-pad:max(20px,env(safe-area-inset-left,0px));background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;min-height:100%}
.site img{display:block;max-width:100%}
.s-in{width:100%;max-width:1180px;margin:0 auto;padding-left:var(--s-pad);padding-right:max(20px,env(safe-area-inset-right,0px))}
.s-sec{padding:64px 0;scroll-margin-top:64px}
.s-claro{background:var(--surface)}
.s-creme{background:var(--cream)}
.s-menta{background:var(--mint-soft)}
.s-ov{display:block;font-family:var(--f-wide);font-stretch:112.5%;font-weight:600;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage-ink)}
.s-h2{font-family:var(--f-display);font-weight:300;font-size:clamp(36px,9.4cqi,66px);line-height:.98;letter-spacing:-.045em;color:var(--sage);text-wrap:balance;margin-top:12px}
.s-h2 em,.s-hero-tt em,.s-frase em,.s-rod-frase em{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--green)}
.s-lede{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:58ch;margin-top:16px}
.s-topo{margin-bottom:32px}
.s-h3{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.s-nota{font-size:12.5px;color:var(--ink-3);margin-top:14px}
/* toda grade começa com uma coluna que pode encolher: sem isso, a fileira de dias das home churches alargava o site no celular */
.s-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:36px;align-items:center}
.site .btn{white-space:normal}

/* cabeçalho */
.s-cab{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s ease,background .2s ease}
.s-cab.rolou{border-bottom-color:var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent)}
.s-cab .s-in{display:flex;align-items:center;gap:12px;height:64px}
.s-marca{display:flex;align-items:center;gap:10px;color:var(--green);flex:none;border-radius:10px}
.s-marca .wm{width:112px;color:var(--ink)}
.s-nav{display:none;gap:2px;margin-left:auto}
.s-nav button{min-height:40px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.s-nav button:hover{background:var(--mint-soft);color:var(--ink)}
.s-cab-acao{margin-left:auto;display:flex;gap:6px;align-items:center}
.s-cab-acao .btn{display:none}

/* menu do celular */
.s-menu{position:absolute;inset:0;z-index:210;background:var(--bg);display:flex;flex-direction:column;padding:12px max(20px,env(safe-area-inset-left,0px)) 28px;animation:fade .2s ease both;overflow-y:auto}
.s-menu-topo{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:16px}
.s-menu nav{display:flex;flex-direction:column}
.s-menu nav button{display:flex;align-items:center;justify-content:space-between;padding:16px 2px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-weight:300;font-size:30px;letter-spacing:-.03em;color:var(--ink)}
.s-menu nav button .ic{color:var(--sage)}
.s-menu-acoes{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:24px}

/* topo do site */
.s-hero{padding:24px 0 56px;overflow:hidden}
.s-hero .s-in{display:grid;grid-template-columns:minmax(0,1fr);gap:36px}
.s-hero-tt{font-family:var(--f-display);font-weight:300;font-size:clamp(44px,13.6cqi,116px);line-height:.92;letter-spacing:-.055em;color:var(--sage);text-wrap:balance;margin-top:14px}
.s-hero-sub{font-size:clamp(17px,2.4cqi,21px);line-height:1.5;color:var(--ink-2);max-width:32ch;margin-top:20px}
.s-hero-acoes{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.s-prox{margin-top:24px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);max-width:460px}
.s-prox-h{font-family:var(--f-display);font-size:30px;font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;flex:none}
.s-prox .x{flex:1}
.s-prox .x b{font-family:var(--f-body);font-weight:600;font-size:14.5px}
.s-midia{position:relative;min-height:440px;border-radius:28px;overflow:hidden;isolation:isolate}
.s-aneis{position:absolute;inset:0;background:repeating-radial-gradient(circle at 62% 44%,var(--ring-a) 0 2px,var(--ring-b) 2px 6px)}
.s-foto-a{position:absolute;right:10%;top:8%;width:56%;aspect-ratio:460/608;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg)}
.s-foto-b{position:absolute;left:7%;bottom:7%;width:34%;aspect-ratio:315/471;border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg);outline:4px solid var(--cream)}
.s-foto-a img,.s-foto-b img{width:100%;height:100%;object-fit:cover}
.s-selo{position:absolute;left:7%;top:7%;width:58px;height:58px;border-radius:50%;background:var(--selo);color:var(--on-selo);display:grid;place-items:center;box-shadow:var(--shadow)}
.s-wm-v{position:absolute;right:-40px;top:50%;width:120px;color:var(--ring-a);transform:translateY(-50%) rotate(-90deg)}

/* cultos */
.s-cultos{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.s-semana{display:flex;flex-direction:column;gap:8px;background:var(--cream);border-radius:24px;padding:16px}
.s-linha{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(64px,auto);gap:6px;flex:1}
.s-linha span{border-radius:12px;padding:13px 12px;font-family:var(--f-wide);font-stretch:112.5%;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;display:flex;align-items:center;min-width:0}
.s-linha span:nth-child(1){background:var(--sage-ink);color:var(--bg)}
.s-linha span:nth-child(2){background:var(--green);color:var(--on-green);justify-content:center;text-align:center}
.s-linha span:nth-child(3){background:var(--mint);color:var(--green);justify-content:center;text-align:center;font-variant-numeric:tabular-nums}
.s-linha.dom{grid-template-columns:minmax(0,1fr) auto}
.s-linha.dom span:nth-child(2){padding-left:16px;padding-right:16px}
.s-end{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px}
.s-end-mapa{width:96px;height:96px;border-radius:16px;overflow:hidden;background:var(--map-bg)}
.s-end-mapa svg{width:100%;height:100%;display:block}
.s-end b{display:block;font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25}
.s-end span.peq{display:block;margin-top:2px}
.s-end .btn{margin-top:10px}
.s-visita{background:var(--mint);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.s-visita p{color:var(--ink-2)}

/* quem somos */
.s-quem-foto{margin:0;border-radius:24px;overflow:hidden;aspect-ratio:315/399;max-height:520px;width:100%}
.s-quem-foto img{width:100%;height:100%;object-fit:cover}
.s-mv{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:28px}
.s-mv > div{border-top:1px solid var(--line);padding-top:14px}
.s-mv p{font-family:var(--f-display);font-size:18.5px;line-height:1.38;letter-spacing:-.01em;color:var(--ink);margin-top:8px}
.s-valores{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.s-valores li{font-size:13px;font-weight:600;color:var(--green);background:var(--mint-soft);border:1px solid var(--mint);padding:6px 12px;border-radius:999px}
.s-chamado{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.s-ch{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:132px}
.s-ch i{width:44px;height:44px;border-radius:50%;background:var(--selo);color:var(--on-selo);display:grid;place-items:center}
.s-ch i .ic{width:20px;height:20px}
.s-ch b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.08;letter-spacing:-.025em;color:var(--ink);margin-top:auto}
.s-frase{font-family:var(--f-display);font-weight:300;font-size:clamp(34px,8.4cqi,72px);line-height:1;letter-spacing:-.045em;color:var(--sage);margin:48px 0 0;text-wrap:balance}

/* jornada */
.s-jor{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.s-jp{background:var(--jc);color:#fff;border-radius:18px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:4px;min-height:132px;position:relative}
.s-jn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-family:var(--f-display);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;margin-bottom:8px}
.s-jp b{font-family:var(--f-wide);font-stretch:112.5%;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.s-jp > span:not(.s-jn):not(.s-jnota){font-size:13px;line-height:1.35;opacity:.94}
.s-jnota{margin-top:auto;padding-top:8px;font-family:var(--f-serif);font-style:italic;font-size:16px;line-height:1.1}
.s-jor-acao{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* home churches */
.s-hc-caixa{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.s-hc-mapa{position:relative;height:280px;border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.s-busca{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface)}
.s-busca:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--mint)}
.s-busca input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--ink)}
.s-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 0 4px}
.s-chips::-webkit-scrollbar{display:none}
.s-chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.s-chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.s-hc-lista{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.s-hc-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.s-hc-item[hidden]{display:none}
.s-hc-item .x b{font-size:15.5px}
.s-hc-item.sel{background:var(--mint-soft);border-radius:12px;padding-left:10px;padding-right:10px}
.s-hc-vazio{padding:18px 4px;color:var(--ink-3)}

/* palavras (fundo escuro, como os bastidores) */
.s-escuro{background:var(--night);color:var(--night-ink)}
.s-escuro .s-ov{color:var(--night-label)}
.s-escuro .s-h2{color:var(--night-ink)}

.s-aovivo{position:relative;overflow:hidden;isolation:isolate;border:1px solid var(--night-line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;background:var(--night-2)}

.s-aovivo::after{content:"";position:absolute;right:-140px;bottom:-140px;width:360px;height:360px;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 10px,var(--night-line) 10px 11px);opacity:.7;z-index:-1}
.s-aovivo-selo{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-wide);font-stretch:112.5%;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--night-ink)}
.s-aovivo-selo i{width:9px;height:9px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 4px rgba(229,72,77,.22)}
.s-aovivo .s-h3{color:var(--night-ink);font-size:24px;font-weight:400;font-family:var(--f-display);letter-spacing:-.02em}
/* a frase já está escrita na foto: a legenda vai embaixo para não cobrir o texto vermelho */
.s-pal-card{margin:0;border-radius:24px;overflow:hidden;background:var(--night-2);border:1px solid var(--night-line);display:flex;flex-direction:column}
.s-pal-img{aspect-ratio:797/608;background:#000}
.s-pal-img img{width:100%;height:100%;object-fit:cover}
.s-pal-card figcaption{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px}
.s-pal-card figcaption small{font-family:var(--f-wide);font-stretch:112.5%;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--night-label)}
.s-pal-card figcaption span{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.3;color:var(--night-ink)}
.btn.s-btn-noite{color:var(--night-ink);border-color:var(--night-line)}
.btn.s-btn-noite:hover{background:var(--night-line)}

.s-ev-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(var(--s-pad) * -1);padding:0 var(--s-pad) 6px}
.s-ev-grid::-webkit-scrollbar{display:none}
.s-ev{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.s-ev-capa{height:180px;position:relative;overflow:hidden;background:var(--jc,var(--green));color:#fff;display:flex;align-items:flex-end;padding:16px}
.s-ev-capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-ev-capa .s-ev-passo{position:relative;font-family:var(--f-wide);font-stretch:112.5%;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.42);padding:5px 10px;border-radius:999px}
.s-ev-capa .s-ev-letra{position:absolute;right:14px;top:10px;font-family:var(--f-display);font-weight:300;font-size:64px;letter-spacing:-.05em;line-height:1;opacity:.9}
.s-ev-txt{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.s-ev-txt .btn{margin-top:auto;align-self:flex-start}
.s-sub{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.s-sub span{font-family:var(--f-wide);font-stretch:112.5%;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}

/* sirva */
.s-sirva-foto{margin:0;border-radius:24px;overflow:hidden;aspect-ratio:797/608;width:100%}
.s-sirva-foto img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.s-min{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column}
.s-min li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.s-min li:last-child{border-bottom:1px solid var(--line)}
.s-min i{width:44px;height:44px;border-radius:50%;background:var(--selo);color:var(--on-selo);display:grid;place-items:center}
.s-min i .ic{width:20px;height:20px}
.s-min b{display:block;font-family:var(--f-display);font-weight:600;font-size:16.5px}
.s-min span{font-size:14px;color:var(--ink-2)}

/* pedido de oração */
.s-form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.s-rot{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.s-rot[hidden]{display:none}
.s-form textarea.campo{min-height:120px;resize:vertical}
.s-anon{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-2)}
.s-cats{display:flex;flex-wrap:wrap;gap:6px}
.s-ok{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.s-ok .s-selo-ok{width:52px;height:52px;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center}

/* contribua */
.s-contrib-cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.s-ct{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.s-ct i{width:46px;height:46px;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center}
.s-ct p{color:var(--ink-2);font-size:14.5px}
.s-ct .btn{margin-top:auto}
.s-pix-qr{width:180px;height:180px;margin:4px auto;padding:10px;background:var(--qr-bg);border-radius:16px;border:1px solid var(--line)}
.s-pix-qr svg{width:100%;height:100%;display:block}

/* app */
.s-lojas{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.s-loja{display:inline-flex;flex-direction:column;justify-content:center;min-height:52px;padding:0 18px;border-radius:14px;background:var(--ink);color:var(--bg);line-height:1.15;text-align:left}
.s-loja small{font-size:11px;opacity:.8}
.s-loja b{font-size:16px;font-weight:600}
.s-app-mock{position:relative;justify-self:center;width:min(280px,78%);aspect-ratio:9/18.5;border-radius:42px;background:var(--frame);padding:10px;box-shadow:var(--shadow-lg)}
.s-app-tela{position:relative;width:100%;height:100%;border-radius:33px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}

.s-app-card{position:relative;background:var(--cream);border-radius:20px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;margin-bottom:auto;margin-top:22%}
.s-app-card .wm{width:96px;color:var(--sage-ink)}
.s-app-card p{font-family:var(--f-display);font-weight:300;font-size:30px;line-height:.92;letter-spacing:-.05em;color:var(--sage)}

.s-app-btn{position:relative;background:var(--green);color:var(--on-green);border-radius:999px;text-align:center;font-weight:600;font-size:13px;padding:11px}

.s-op b{font-family:var(--f-display);font-weight:600;font-size:15px}
.s-op span{font-size:12.5px;color:var(--ink-3)}

@container site (max-width: 360px){ .s-rod-grid{grid-template-columns:minmax(0,1fr)} }

@container site (min-width: 640px){

  .s-mv{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
  .s-cultos .s-semana{grid-row:span 2}
  .s-jor{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s-hc-mapa{height:340px}
  .s-pal{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:stretch}
  .s-ev-grid{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;margin:0;padding:0}
  .s-rod-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s-contrib-cards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .s-op-cultos{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* computador */
@container site (min-width: 1000px){
  .site{--s-pad:40px}
  .s-sec{padding:112px 0}
  .s-nav{display:flex}
  .s-cab-acao{margin-left:8px}

  .s-hero{padding:40px 0 96px}

  .s-midia{min-height:640px}
  .s-grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:72px}

  .s-jor{grid-template-columns:repeat(6,minmax(0,1fr))}
  .s-chamado{grid-template-columns:repeat(4,minmax(0,1fr))}

  .s-ev-grid{grid-template-columns:repeat(4,minmax(0,1fr))}

}

  return '<svg class="simb ' + (cls||'') + '" width="' + px + '" height="' + px + '" viewBox="0 0 281 281" fill="none" stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><g class="sa"><path d="M277.5 2.5 147.5 132.5M147.5 35.5v97.5h97"/></g><g class="sb"><path d="M2.5 277.5l130-130M35.5 147.5h97v97"/></g><g class="sc"><path d="M41.5 41.5l85 85M154.5 154.5l52 52"/></g></svg>'; }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ini(nome){ const p = nome.replace(/\(.*?\)/g,'').trim().split(/\s+/); return ((p[0]||'')[0] + ((p[1]||p[0]||'')[0]||'')).toUpperCase(); }
function av(nome, cls){ return '<span class="av ' + (cls||'') + '" aria-hidden="true">' + esc(ini(nome)) + '</span>'; }
function avs(nomes, extra){ return '<span class="avs">' + nomes.map(n => av(n)).join('') + (extra ? '<span class="av">+' + extra + '</span>' : '') + '</span>'; }

function ir(tela, volta){ if (!T[tela]) return; if (!volta && E.tela !== tela) E.hist.push(E.tela); E.tela = tela; sincronizarEtapa(); desenhar(volta ? 'volta' : 'entra'); }
function voltar(){ const t = E.hist.pop(); if (t) ir(t, true); }
function sincronizarEtapa(){ const i = ETAPAS.findIndex(e => e.tela === E.tela); if (i >= 0) E.etapa = i; try { history.replaceState(null, '', '#' + ETAPAS[E.etapa].id); } catch (e) {} }
function irEtapa(i){ i = Math.max(0, Math.min(ETAPAS.length - 1, i)); const et = ETAPAS[i]; E.etapa = i; E.persona = et.p; if (et.antes) et.antes(); E.hist = []; E.tela = et.tela; try { history.replaceState(null, '', '#' + et.id); } catch (e) {} desenhar('entra'); tour.classList.remove('aberto'); }

function siteMontar(){

}
function semAcento(t){ return t.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function siteFiltrarHC(){
  const q = semAcento(((document.getElementById('s-hc-busca') || {}).value || '').trim().toLowerCase());
  let n = 0;
  document.querySelectorAll('.s-hc-item').forEach(li => { const ok = (!q || semAcento(li.dataset.bairro).includes(q)) && (E.siteDia === 'Todos' || li.dataset.dia === E.siteDia); li.hidden = !ok; if (ok) n++; });
  const vz = document.getElementById('s-hc-vazio'); if (vz) vz.hidden = n > 0;
}
function desenharDisp(site){
  let d = document.getElementById('disp');
  if (!d) { d = document.createElement('div'); d.id = 'disp'; d.className = 'disp'; d.setAttribute('role', 'group'); d.setAttribute('aria-label', 'Ver o site em'); palco.appendChild(d); }
  d.hidden = !site; if (!site) return;
  d.innerHTML = [['celular', 'celular', 'Celular'], ['tablet', 'tablet', 'Tablet'], ['computador', 'monitor', 'Computador']].map(o => '<button type="button" data-acao="site-disp" data-d="' + o[0] + '" aria-pressed="' + (E.siteDisp === o[0]) + '">' + ic(o[1]) + o[2] + '</button>').join('');
}

function desenhar(anim){
  const def = T[E.tela]; const exigido = def.exige && !pode(def.exige);
  const desk = !!def.desk && !exigido; const site = !!def.site; const molde = window.innerWidth >= 1024;
  /* sem moldura (celular ou tablet de verdade), o site usa o formato de celular: a classe "computador" centralizava as janelas */
  aparelho.className = 'aparelho ' + (site ? (molde ? E.siteDisp : 'celular') : desk ? 'computador' : 'celular');
  app.classList.toggle('site-modo', site);
  const ch = aparelho.querySelector('.chrome span'); if (ch) ch.textContent = site ? 'boasnovaschurch.com' : 'boasnovas · moderação';
  const url = site && molde && E.siteDisp !== 'computador';
  let html = '';
  if (!site || molde) html += '<div class="status" aria-hidden="true"><span class="tnum">9:41</span><span class="st"><svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="19" height="10" rx="3"/><rect x="3" y="3" width="12" height="6" rx="1.5" fill="currentColor" stroke="none"/><path d="M22 4.5v3"/></svg></span></div>';
  html += '<div class="vista' + (def.cheia ? ' cheia' : '') + (site ? ' site-v' + (url ? ' com-url' : '') : '') + (anim ? ' ' + anim : '') + '" id="vista">' + (exigido ? semAcesso(def.exige) : def.r()) + '</div>';
  if (url) html += '<div class="s-url" aria-hidden="true">' + ic('cadeado') + 'boasnovaschurch.com</div>';
  if (def.aba && !desk) html += '<nav class="abas" aria-label="Navegação do app">' + ABAS.map(a => '<button class="aba" type="button" data-ir="' + a[0] + '"' + (def.aba === a[0] ? ' aria-current="page"' : '') + '>' + ic(a[1]) + '<span>' + a[2] + '</span></button>').join('') + '</nav>';
  app.innerHTML = html;
  const v = document.getElementById('vista'); if (v) v.scrollTop = 0;
  desenharDisp(site); if (site) siteMontar();
  desenharTour(); escalar();
}

function escalar(){ if (window.innerWidth < 1024) { aparelho.style.transform = ''; return; }
  const w = palco.clientWidth, h = palco.clientHeight;
  const tipo = aparelho.classList.contains('celular') ? 'celular' : aparelho.classList.contains('tablet') ? 'tablet' : 'computador';
  const dim = { celular:[390, 844], tablet:[820, 1180], computador:[1240, 780] }[tipo];
  /* com os botões de aparelho do site no topo, o aparelho desce para não ficar embaixo deles */
  const d = document.getElementById('disp'); const topo = d && !d.hidden ? 64 : 0;
  const k = Math.min(1, (h - 40 - topo) / dim[1], (w - 48) / dim[0]);
  aparelho.style.transform = 'translate(-50%,calc(-50% + ' + (topo / 2) + 'px)) scale(' + k.toFixed(4) + ')'; }

document.addEventListener('click', ev => {

  if (t.dataset.persona) { E.persona = t.dataset.persona; desenhar(); return; }

  if (t.dataset.tema) { const v = t.dataset.tema; if (v === 'sistema') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', v); try { localStorage.setItem('bn-tema', v); } catch (e) {} desenharTour(); return; }
  if (t.dataset.ir) { fecharFolha(); ir(t.dataset.ir); return; }
  const f = A[t.dataset.acao]; if (f) f(t);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (app.querySelector('.camada')) fecharFolha(); else if (app.querySelector('.s-menu')) fecharSiteMenu(); else tour.classList.remove('aberto'); return; }
  const tag = (ev.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if (ev.key === 'ArrowRight') irEtapa(E.etapa + 1); else if (ev.key === 'ArrowLeft') irEtapa(E.etapa - 1);
  else if (ev.key === 'Enter' && ev.target.matches('tr[data-acao]')) A[ev.target.dataset.acao](ev.target);
});

try { const tm = localStorage.getItem('bn-tema'); if (tm && tm !== 'sistema') document.documentElement.setAttribute('data-theme', tm); } catch (e) {}
